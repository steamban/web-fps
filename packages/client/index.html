<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-fps</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14161a;
        color: #e6e8ea;
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(420px, 100% - 32px);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 0.85rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8d949c;
      }
      form:not([hidden]) {
        display: grid;
        gap: 8px;
      }
      input,
      button {
        font: inherit;
        padding: 9px 11px;
        border: 1px solid #2c3037;
        border-radius: 6px;
      }
      input {
        background: #1b1e23;
        color: inherit;
      }
      button {
        background: #2f6fd0;
        border-color: transparent;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #23262b;
        color: #6b7280;
        cursor: not-allowed;
      }
      #phase {
        margin: 0 0 12px;
        color: #8d949c;
      }
      ul {
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 4px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        background: #1b1e23;
        border-radius: 6px;
      }
      li span {
        flex: 1;
      }
      li button {
        padding: 3px 9px;
        font-size: 0.85em;
        background: transparent;
        border-color: #4a3038;
        color: #e2828f;
      }
      #host-controls:not([hidden]) {
        display: flex;
        gap: 8px;
      }
      /* #game covers the page, so the host's Pause and Close have to be lifted out of it
         or a running match can only be ended by reloading — which hands the lobby to
         somebody else and leaves the match running. Pinned to a corner rather than left
         in the centred layout, where they would sit under the crosshair and catch the
         click that recaptures the mouse. */
      body:has(#game:not([hidden])) #host-controls:not([hidden]) {
        position: fixed;
        top: 12px;
        right: 12px;
        width: auto;
        z-index: 1;
      }
      #host-controls button {
        flex: 1;
      }
      #close {
        background: transparent;
        border-color: #4a3038;
        color: #e2828f;
      }
      #status {
        min-height: 1.5em;
        margin: 16px 0 0;
        color: #c2a86a;
      }
      #sandbox {
        background: transparent;
        border-color: #2c3037;
        color: #8d949c;
      }
      #game:not([hidden]) {
        position: fixed;
        inset: 0;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hint {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        margin: 0;
        padding: 7px 13px;
        border-radius: 6px;
        background: #14161acc;
        color: #8d949c;
        white-space: nowrap;
      }
      #hint a {
        color: #8d949c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>web-fps</h1>

      <form id="join-form">
        <input id="address" placeholder="192.168.1.5:8080" autocomplete="off" spellcheck="false" />
        <input id="name" placeholder="your name" maxlength="24" autocomplete="off" />
        <button type="submit">Join</button>
        <button id="sandbox" type="button">Movement sandbox</button>
      </form>

      <section id="lobby" hidden>
        <p id="phase"></p>
        <ul id="players"></ul>
        <div id="host-controls" hidden>
          <button id="start" type="button">Start</button>
          <button id="pause" type="button">Pause</button>
          <button id="close" type="button">Close</button>
        </div>
      </section>

      <p id="status"></p>

      <section id="game" hidden>
        <canvas id="view"></canvas>
        <p id="hint">
          Click to look around &middot; WASD to move &middot; Space to jump &middot; Esc to
          release the mouse &middot; <a href="/">leave</a>
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
